spring:
  datasource:
    url: jdbc:h2:mem:demo_test;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE
    username: sa
    password: ""
    hikari:
      maximum-pool-size: 4
      connection-timeout: 3000
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-test.sql
      data-locations: classpath:data-test.sql

logging:
  level:
    io.github.jsonsql: warn
    org.springframework: warn
